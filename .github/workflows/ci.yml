name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate SKILL.md + run pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          # 只装 pytest + pytest-cov，其它 Skill 都是 stdlib
          python -m pip install pytest pytest-cov

      - name: Validate SKILL.md frontmatter
        run: |
          python validate_skills.py

      - name: Run per-skill tests
        run: |
          set +e  # 允许单 skill 失败不阻塞其它
          python -m pytest skills/hlzd-inquiry-qualify/scripts/test_inquiry_parser.py -q
          python -m pytest skills/hlzd-b2b-research/tests/ -q
          python -m pytest skills/hlzd-buyer-finder/tests/ -q
          python -m pytest skills/hlzd-market-report/tests/ -q
          python -m pytest skills/hlzd-customer-due-diligence/tests/ -q
          python -m pytest skills/hlzd-cold-outreach/tests/ -q
          python -m pytest skills/hlzd-solution-match/tests/ -q
          python -m pytest skills/hlzd-quotation-gen/tests/ -q
          python -m pytest skills/hlzd-negotiation-playbook/tests/ -q
          python -m pytest skills/hlzd-trade-compliance/tests/ -q

      - name: Run demo orchestrator (smoke)
        run: |
          python skills-demo/run_full_demo.py --all

      - name: Upload demo traces artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-traces
          path: skills-demo/outputs/
          if-no-files-found: ignore
