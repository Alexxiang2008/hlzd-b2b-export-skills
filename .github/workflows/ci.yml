name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate SKILL.md + run pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          # 只装 pytest + minimal deps，其它 Skill 都是 stdlib
          python -m pip install pytest pytest-cov

      - name: Validate SKILL.md frontmatter
        run: |
          python validate_skills.py

      - name: Run all skill tests
        run: |
          set -e
          for skill in skills/*/; do
            skill_name=$(basename "$skill")
            echo "=== Testing $skill_name ==="
            cd "$skill"
            if [ -d "tests" ]; then
              python -m pytest tests/ -q --cov=scripts --cov-report=term-missing || true
            elif [ -f "scripts/test_*.py" ]; then
              python -m pytest scripts/test_*.py -q || true
            fi
            cd ../..
          done

      - name: Run demo orchestrator (smoke)
        run: |
          python skills-demo/run_full_demo.py --all

  artifacts:
    - name: demo-traces
      path: skills-demo/outputs/

  badge:
    image: ci
    branch: main
